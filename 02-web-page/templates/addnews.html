{% extends "layout.html" %}

{% block title %}Додати новину - Портал Геймера{% endblock %}

{% block content %}
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>

<div class="admin-panel-container panel-box" style="max-width: 800px;">
    <h1 class="page-title">Створення новини</h1>
    <form action="{{ url_for('addnews') }}" method="POST" class="admin-form">
        <div class="form-group">
            <label for="title" class="form-label">Заголовок</label>
            <input type="text" id="title" name="title" class="form-input" required>
        </div>
        <div class="form-group">
            <label for="content" class="form-label">Текст новини</label>
            <textarea id="content" name="content" class="form-textarea" required></textarea>
        </div>
        <button type="submit" class="btn-primary submit-btn">Опублікувати запис</button>
    </form>
</div>

<script>
    $(document).ready(function() {
        $('#content').summernote({
            placeholder: 'Напишіть вашу новину тут. Можна додавати текст, списки та невеликі фотографії...',
            tabsize: 2,
            height: 350, // Висота редактора
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'italic', 'underline', 'clear']],
                ['color', ['color']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link', 'picture', 'video']],
                ['view', ['fullscreen', 'codeview']]
            ],
            callbacks: {
                // Перехоплюємо подію завантаження зображення
                onImageUpload: function(files) {
                    for (let i = 0; i < files.length; i++) {
                        let file = files[i];
                        
                        // Перевірка розміру (100 КБ = 100 * 1024 байт)
                        if (file.size > 100 * 1024) {
                            alert('Помилка: Розмір зображення "' + file.name + '" перевищує 100 КБ! Будь ласка, стисніть фото перед завантаженням. Використовуйте формат jpg.]');
                            continue; // Відхиляємо файл
                        }
                        
                        // Якщо розмір допустимий, конвертуємо у Base64 і вставляємо
                        let reader = new FileReader();
                        reader.onload = function(e) {
                            $('#content').summernote('insertImage', e.target.result, file.name);
                        }
                        reader.readAsDataURL(file);
                    }
                }
            }
        });
    });
</script>
{% endblock %}
